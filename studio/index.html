<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI 스튜디오</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="css/panel.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/components-more.css">
    <link rel="stylesheet" href="css/skins-a.css">
    <link rel="stylesheet" href="css/skins-b.css">
    <link rel="stylesheet" href="css/skins-c.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/builder.css">
    <script src="js/state.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/components-forms.js" defer></script>
    <script src="js/components-more.js" defer></script>
    <script src="js/export.js" defer></script>
    <script src="js/theme-panel.js" defer></script>
    <script src="js/canvas.js" defer></script>
    <script src="js/inspector.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="app">
        <aside class="panel" aria-label="테마 설정">
            <header>
                <h1>UI 스튜디오</h1>
                <a href="../" class="home">← UI 미니 사전</a>
            </header>
            <section>
                <h2 class="sec-title">모양</h2>
                <label class="ctl">
                    <span class="ctl-name">모서리 둥글기</span>
                    <output class="val" data-var="radius">12px</output>
                    <input type="range" data-var="radius" min="0" max="32" step="1" value="12" aria-label="모서리 둥글기">
                </label>
                <label class="ctl">
                    <span class="ctl-name">버튼 높이</span>
                    <output class="val" data-var="btn-h">44px</output>
                    <input type="range" data-var="btn-h" min="32" max="64" step="2" value="44" aria-label="버튼 높이">
                </label>
                <label class="ctl">
                    <span class="ctl-name">버튼 좌우 여백</span>
                    <output class="val" data-var="btn-px">20px</output>
                    <input type="range" data-var="btn-px" min="10" max="40" step="2" value="20" aria-label="버튼 좌우 여백">
                </label>
                <label class="ctl">
                    <span class="ctl-name">본문 글자 크기</span>
                    <output class="val" data-var="fs">15px</output>
                    <input type="range" data-var="fs" min="13" max="19" step="1" value="15" aria-label="본문 글자 크기">
                </label>
                <label class="ctl">
                    <span class="ctl-name">제목 크기</span>
                    <output class="val" data-var="h1">40px</output>
                    <input type="range" data-var="h1" min="24" max="64" step="2" value="40" aria-label="제목 크기">
                </label>
                <label class="ctl">
                    <span class="ctl-name">요소 간격</span>
                    <output class="val" data-var="gap">20px</output>
                    <input type="range" data-var="gap" min="8" max="40" step="2" value="20" aria-label="요소 간격">
                </label>
                <label class="ctl">
                    <span class="ctl-name">테두리 두께</span>
                    <output class="val" data-var="bw">1px</output>
                    <input type="range" data-var="bw" min="0" max="3" step="1" value="1" aria-label="테두리 두께">
                </label>
            </section>
            <section>
                <h2 class="sec-title">추천 색 조합</h2>
                <p class="hint">누르면 바로 바뀌어요</p>
                <input id="palSearch" class="pal-search" type="search" placeholder="이름·분위기로 찾기 (예: 블루, 다크)" aria-label="색 조합 검색" autocomplete="off">
                <div id="palettes" class="palettes" role="group" aria-label="추천 색 조합"></div>
                <p id="palEmpty" class="hint" hidden>찾는 조합이 없어요. 다른 말로 찾아보세요.</p>
            </section>
            <section>
                <h2 class="sec-title">내 색 조합</h2>
                <label class="color-row">
                    <span>배경색</span>
                    <input type="color" data-color="bg" value="#F7F5F0">
                    <code class="hex-val">#F7F5F0</code>
                </label>
                <label class="color-row">
                    <span>제목 글자색</span>
                    <input type="color" data-color="title" value="#1A1A1A">
                    <code class="hex-val">#1A1A1A</code>
                </label>
                <label class="color-row">
                    <span>본문 글자색</span>
                    <input type="color" data-color="sub" value="#6B6B6B">
                    <code class="hex-val">#6B6B6B</code>
                </label>
                <label class="color-row">
                    <span>포인트색</span>
                    <input type="color" data-color="point" value="#C54118">
                    <code class="hex-val">#C54118</code>
                </label>
                <ul id="contrast" class="contrast" aria-live="polite"></ul>
            </section>
            <footer>
                <div class="actions">
                    <button id="copyCss" class="btn-ghost" type="button">CSS 복사</button>
                    <button id="reset" class="btn-ghost" type="button">처음으로</button>
                </div>
                <p class="hint">블록을 누르면 오른쪽에서 스킨·효과를 바꿀 수 있어요</p>
            </footer>
        </aside>
        <main class="stage" aria-label="캔버스">
            <div class="toolbar" role="toolbar" aria-label="캔버스 도구">
                <div class="devices" role="group" aria-label="미리보기 크기">
                    <button class="dev" type="button" data-dev="390" aria-pressed="false">모바일</button>
                    <button class="dev" type="button" data-dev="768" aria-pressed="false">태블릿</button>
                    <button class="dev" type="button" data-dev="1280" aria-pressed="true">PC</button>
                </div>
                <button id="addBtn" class="tb-btn" type="button">+ 요소 추가</button>
                <button id="exportBtn" class="tb-btn tb-primary" type="button">내보내기</button>
            </div>
            <div id="canvas" class="canvas">
                <div id="frame" class="frame">
                    <div id="preview" class="pv" aria-label="미리보기"></div>
                </div>
            </div>
        </main>
        <aside id="inspector" class="inspector" aria-label="블록 설정" aria-live="off">
        </aside>
    </div>
    <div id="snack" class="snack" role="status" aria-live="polite" hidden>
        <span id="snackText"></span>
        <button id="snackUndo" class="snack-btn" type="button">되돌리기</button>
    </div>
    <p id="status" class="status-line" role="status" aria-live="polite" aria-atomic="true"></p>

    <dialog id="addDlg" class="dlg" aria-labelledby="addTitle">
        <div class="dlg-head">
            <h2 id="addTitle">요소 추가</h2>
            <button class="dlg-x" type="button" data-close aria-label="닫기">×</button>
        </div>
        <p class="hint">고른 블록 바로 아래에 들어가요</p>
        <div id="addList" class="add-list"></div>
    </dialog>

    <dialog id="exportDlg" class="dlg" aria-labelledby="expTitle">
        <div class="dlg-head">
            <h2 id="expTitle">내보내기</h2>
            <button class="dlg-x" type="button" data-close aria-label="닫기">×</button>
        </div>
        <form id="expForm" method="dialog">
            <fieldset class="exp-choices">
                <legend>무엇을 할까요?</legend>
                <label class="exp-opt">
                    <input type="radio" name="expKind" value="html" checked>
                    HTML 파일 하나로 받기
                    <small>다른 곳에서 바로 열 수 있는 파일</small>
                </label>
                <label class="exp-opt">
                    <input type="radio" name="expKind" value="json">
                    작업 파일(JSON)로 저장
                    <small>나중에 다시 불러와서 고칠 수 있어요</small>
                </label>
                <label class="exp-opt">
                    <input type="radio" name="expKind" value="load">
                    작업 파일 불러오기
                    <small>지금 화면은 바뀌어요</small>
                </label>
                <label class="exp-opt">
                    <input type="radio" name="expKind" value="code">
                    코드 복사
                    <small>HTML 코드를 클립보드에 복사</small>
                </label>
            </fieldset>
            <input id="loadFile" type="file" accept=".json,application/json" class="visually-hidden" tabindex="-1" aria-hidden="true">
            <div class="dlg-actions">
                <button class="btn-ghost" type="button" data-close>취소</button>
                <button id="expRun" class="tb-btn tb-primary" type="button">실행</button>
            </div>
        </form>
    </dialog>
</body>
</html>
